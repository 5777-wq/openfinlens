<!DOCTYPE html>
<!-- OpenFinLens 轻量桌面版（2026-11-20）：独立入口，应用壳布局。
     「像软件」三件：①应用壳（100dvh 固定面板、页面不滚动、面板内部滚动、
     可拖拽分隔条调面板大小）；②独立窗口（desktop.webmanifest display:standalone，
     可从浏览器「安装应用」脱离地址栏运行，配 SW 注册满足安装条件）；
     ③键盘操作（/ 聚焦搜索、方向键调分隔条、Enter 开 K 线）。
     复用移动站三件套的令牌与数据内核（css/bundle.css + js/bundle.js 的 window
     全局面），本页只新增 css/desktop.css（应用壳层）与 js/desktop.js（面板装配
     层，manifest notLoaded 登记、不进两个 bundle——移动用户零字节负担）。
     安卓壳/PWA/小程序仍指向根 URL，互不影响。
     首帧主题：静态 daylight，下面的内联脚本按 gfd_settings 存量修正（与 index.html 同约定）。 -->
<html lang="zh-CN" data-theme="daylight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OpenFinLens 桌面版 · 全球金融看板</title>
<meta name="description" content="OpenFinLens 桌面版：自选实时盘、K线详情、新闻流与美股信号，应用壳多面板布局。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2335e1ff'/%3E%3C/svg%3E">
<link rel="manifest" href="desktop.webmanifest">
<meta name="theme-color" content="#ffffff">
<script>
/* 首帧主题（防闪）：与 index.html 同一份存量（gfd_settings.theme），脏值落 daylight */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('gfd_settings') || '{}');
    var t = s && s.theme;
    if (t !== 'nexus' && t !== 'daylight') t = 'daylight';
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name="theme-color"]').content = t === 'nexus' ? '#0b0e14' : '#ffffff';
  } catch (e) { /* 隐私模式保持静态值 */ }
})();
</script>
<link rel="stylesheet" href="css/bundle.css?v=20261110a">
<link rel="stylesheet" href="css/desktop.css?v=20261110a">
</head>
<body>
<div class="dt-app">
  <header class="dt-top">
    <a class="dt-brand" href="./index.html" aria-label="OpenFinLens 桌面版首页">
      <span class="dt-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none">
          <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
            <line x1="6" y1="4" x2="6" y2="8"></line>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="18" y1="2" x2="18" y2="6"></line>
            <line x1="6" y1="17" x2="6" y2="20"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="18" y1="15" x2="18" y2="19"></line>
          </g>
          <g fill="#ffffff">
            <rect x="3.6" y="8" width="4.8" height="9" rx="1.4"></rect>
            <rect x="9.6" y="13" width="4.8" height="7" rx="1.4"></rect>
            <rect x="15.6" y="6" width="4.8" height="9" rx="1.4"></rect>
          </g>
        </svg>
      </span>OpenFinLens</a>
    <span class="dt-tag">桌面版</span>
    <div class="dt-search">
      <input id="dtSearch" type="search" placeholder="搜索代码 / 名称，回车直达 K 线（按 / 聚焦）"
             autocomplete="off" spellcheck="false" aria-label="搜索标的">
      <ul id="dtSearchList" class="dt-search-list" role="listbox" aria-label="搜索结果" hidden></ul>
    </div>
    <div class="dt-actions">
      <button id="dtInstall" class="dt-btn" type="button" hidden>安装应用</button>
      <button id="dtTheme" type="button" class="dt-btn" aria-label="切换深浅模式">日光</button>
      <a class="dt-btn dt-btn-link" href="./index.html">返回完整版</a>
    </div>
  </header>

  <div class="dt-tape" id="dtTape" role="status" aria-label="全球指数行情条">
    <span class="dt-tape-item dt-muted">行情载入中…</span>
  </div>

  <main class="dt-main">
    <section class="dt-panel dt-side" aria-label="自选">
      <div class="dt-panel-head">
        <h2>自选</h2>
        <span class="dt-muted" id="dtWatchMeta">与完整版实时互通</span>
      </div>
      <div id="dtWatchBody" class="dt-watch-body">
        <div class="dt-empty">载入中…</div>
      </div>
    </section>

    <div class="dt-split dt-vsplit" id="dtVsplit" role="separator" aria-orientation="vertical"
         tabindex="0" title="拖拽调整自选栏宽度（双击复位，方向键微调）"
         aria-label="调整自选栏宽度"></div>

    <div class="dt-center">
      <section class="dt-panel dt-kline" aria-label="K线详情">
        <div class="dt-panel-head">
          <h2 id="dtKlineTitle">K线</h2>
          <div class="dt-seg" role="group" aria-label="K线周期">
            <button type="button" class="dt-seg-btn on" data-period="day">日</button>
            <button type="button" class="dt-seg-btn" data-period="week">周</button>
          </div>
        </div>
        <div id="dtKlineHost" class="dt-kline-host">
          <div class="dt-empty">从自选或搜索选择一个标的</div>
        </div>
      </section>

      <div class="dt-split dt-hsplit" id="dtHsplit" role="separator" aria-orientation="horizontal"
           tabindex="0" title="拖拽调整下排高度（双击复位，方向键微调）"
           aria-label="调整下排面板高度"></div>

      <div class="dt-bottom">
        <section class="dt-panel dt-news" aria-label="新闻流">
          <div class="dt-panel-head">
            <h2>新闻流</h2>
            <span class="dt-muted">财经快讯 · 5 分钟轮询</span>
          </div>
          <ol id="dtNewsBody" class="dt-news-body">
            <li class="dt-empty">载入中…</li>
          </ol>
        </section>

        <section class="dt-panel dt-ussig" aria-label="美股信号">
          <div class="dt-panel-head">
            <h2>美股信号</h2>
            <span class="dt-muted" id="dtUssigClock">RSI6/14 · Vegas 通道</span>
          </div>
          <div id="dtUssigBody" class="dt-ussig-body">
            <div class="dt-empty">载入中…</div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="dt-foot">
    <span>行情与信号仅供研究参考，不构成任何建议</span>
    <span class="dt-muted" id="dtStat"></span>
  </footer>
</div>

<script src="core/vendor/lightweight-charts.standalone.production.js?v=4.2.3" defer></script>
<script src="js/bundle.js?v=20261110a" defer></script>
<!-- NewsSource 在懒加载包里，桌面版不载懒加载包，单独挂这一个源模块（window.U 依赖 → 必须在 bundle.js 之后） -->
<script src="js/sources/news.js?v=20261110a" defer></script>
<script src="js/desktop.js?v=20261110a" defer></script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js')})</script>
</body>
</html>
