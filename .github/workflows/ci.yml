# 离线确定性测试挂到 push/PR；组数与"离线/实网"划分以 _test/run-all.mjs 的 groups 数组为准
# （该脚本跑完会打印"共 N 组（离线 x / 实网 y）"，别在注释里写死数字——写死必过期）。
# 实网组（breadth/detail/degrade --net/boards/live/history）依赖第三方接口且受深夜清算时段守卫影响，留给本地/手动跑。
# 数据改动也要测：产物是页面上的数字，数字错了页面照旧显示得很正常。
# 所以 data/ 不再被 paths-ignore 排除——采集 workflow 自己也会在 push 之前跑一遍离线契约测试当闸门。
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run offline test groups
        run: node _test/run-all.mjs --offline

      # 数据新鲜度哨兵已随「分支解耦」迁往 deploy-pages.yml（2026-11-19 monorepo Phase 1）：
      # 采集产物改写 data 分支后，main 检出里的 data/ 只是冻结的离线测试夹具，
      # 在这里查新鲜度必然全红。哨兵跟着数据走——deploy-pages 每次部署前对
      # data 分支检出的产物做同样的体检（阈值逐字沿用），部署被挡住即为断更信号。
