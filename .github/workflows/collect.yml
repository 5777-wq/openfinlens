# 全球事件采集任务：GDELT + 新浪7x24 → data/events/global-events.json（5 分钟/轮，GDELT 本体 15 分钟级）
# 伯克希尔 13F：SEC EDGAR → data/actors/berkshire.json（季度数据，每 6 小时对时一次）
# 海外源只在 Actions 侧访问；浏览器永远不直连 GDELT/SEC（见 js/sources/gdelt.js 与 js/sources/sec.js）。
# 数据无变化时不产生提交；push 冲突时 rebase 重试（用户可能同时手推代码）。
name: collect

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect GDELT + Sina global events
        run: node _scripts/collect-events.mjs

      - name: Refresh 13F / fund holdings / factor-ETF holdings (every ~6h UTC 00/06/12/18)
        run: |
          # GitHub 定时在高负载整点常延迟数分钟：精确匹配 M=="00" 曾会因延迟跨跳
          # 静默跳过整个 6h 档。改用 10 分钟窗口（0:00/6:00/12:00/18:00 后 10 分钟内
          # 必中某一跳）；脚本自身幂等（无变化不写文件），重复执行无害。
          # ETF 持仓是日更数据，挂 6h 档而不是 */5：Invesco 接口对密集请求回 406（软限流）。
          H=$(date -u +%H); M=$(date -u +%M); MINS=$((10#$H * 60 + 10#$M))
          if [ $(( MINS % 360 )) -lt 10 ]; then
            node _scripts/collect-13f.mjs || echo "13f collect failed (keep old data)"
            node _scripts/collect-fundholds.mjs || echo "fundholds collect failed (keep old data)"
            node _scripts/collect-etf.mjs || echo "etf collect failed (keep old data)"
          fi

      - name: Commit if changed
        run: |
          git config user.name "openfinlens-bot"
          git config user.email "actions@users.noreply.github.com"
          # 整个 data/actors 目录都进 add：此前只 add 两个文件，13f.json/fundholds.json
          # 采集成功却从不提交（上线数据全靠手动推的那一次），CI 侧更新会被静默丢掉
          git add data/events/global-events.json data/actors
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh global events + berkshire 13f [skip ci]"
            # 三连败必须红：本 workflow 是项目唯一的"后端"，commit 只在 runner 上，
            # 推不上去=数据静默断更（旧写法循环最后是 sleep 5，步骤恒绿）
            ok=0
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              git pull --rebase origin main || true
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "::error::git push failed 3x — collected data did NOT reach remote"
              exit 1
            fi
          fi
